<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>College Portal Tracker</title>
<meta name="theme-color" content="#F7F8FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Portals">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* Layout: a plain grouped list (Reach / Target / Safety) like a phone settings screen, with a sticky search bar and one progress line. */
:root {
  --bg: #F7F8FA; --ink: #15181E; --muted: #6A707C; --line: #E3E6EB; --hover: #EEF0F3; --press: #E4E7EB;
  --field: #FFFFFF; --link: #0B63CE; --link-ink: #FFFFFF; --done: #18864B; --danger: #C0362C;
  --f: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111317; --ink: #ECEEF1; --muted: #9AA0AA; --line: #262A31; --hover: #1A1D22; --press: #22262C;
  --field: #181B20; --link: #5AA9FF; --link-ink: #0B1220; --done: #3DBE78; --danger: #FF7B72; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #111317; --ink: #ECEEF1; --muted: #9AA0AA; --line: #262A31; --hover: #1A1D22; --press: #22262C;
  --field: #181B20; --link: #5AA9FF; --link-ink: #0B1220; --done: #3DBE78; --danger: #FF7B72; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.45 var(--f); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 72px; }
h1, h2 { margin: 0; text-wrap: balance; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }

/* Header */
h1 { font-size: 30px; font-weight: 700; letter-spacing: -.015em; line-height: 1.15; }
.progress { margin-top: 12px; display: grid; gap: 7px; }
.progress-label { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; font-variant-numeric: tabular-nums; }
.progress-label span:last-child { color: var(--muted); }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--done); transition: width .3s ease-out; }

/* Toolbar */
.toolbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 16px 12px; margin-top: 8px; display: grid; gap: 10px; }
.search { position: relative; }
.search input { width: 100%; padding: 11px 14px 11px 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--field); }
.search input:hover { border-color: var(--muted); }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.results { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--field); border-radius: 10px; box-shadow: 0 10px 30px rgb(0 0 0 / .18), 0 1px 3px rgb(0 0 0 / .1); overflow: hidden; z-index: 6; }
.results button { display: flex; width: 100%; justify-content: space-between; gap: 12px; text-align: left; padding: 11px 14px; border: 0; background: none; cursor: pointer; }
.results button + button { border-top: 1px solid var(--line); }
.results button[aria-selected="true"], .results button:hover { background: var(--hover); }
.results button small { color: var(--link); font-size: 14px; white-space: nowrap; }
.segmented { display: flex; background: var(--press); padding: 2px; border-radius: 8px; }
.segmented button { flex: 1; border: 0; background: none; padding: 6px 8px; border-radius: 6px; font-size: 14px; cursor: pointer; color: var(--muted); }
.segmented button:hover { color: var(--ink); }
.segmented button[aria-pressed="true"] { background: var(--field); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgb(0 0 0 / .12); }

/* List */
.group { margin-top: 28px; }
.group:first-child { margin-top: 8px; }
.group h2 { font-size: 15px; font-weight: 600; color: var(--muted); padding: 0 8px 6px; }
.rows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 12px; padding: 0 4px 0 8px; border-bottom: 1px solid var(--line); min-height: 52px; }
.row:not(.editing):hover { background: var(--hover); }
.check { position: relative; flex: 0 0 24px; height: 24px; cursor: pointer; }
.check input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.check .box { position: absolute; inset: 0; border: 2px solid var(--muted); border-radius: 6px; display: grid; place-items: center; transition: background .12s, border-color .12s; }
.check .box svg { opacity: 0; color: #fff; transition: opacity .12s; }
.check:hover .box { border-color: var(--ink); }
.check input:checked + .box { background: var(--done); border-color: var(--done); }
.check input:checked + .box svg { opacity: 1; }
.check input:focus-visible + .box { outline: 2px solid var(--link); outline-offset: 2px; }
.name { flex: 1; min-width: 0; padding: 14px 0; color: var(--ink); text-decoration: none; overflow-wrap: anywhere; }
a.name:hover { color: var(--link); text-decoration: underline; text-underline-offset: 3px; }
a.name:active { opacity: .7; }
.arrow { margin-left: 6px; color: var(--link); font-size: 14px; }
.done .name { color: var(--muted); }
.tbtn { border: 0; background: none; padding: 7px 10px; border-radius: 6px; font-size: 15px; color: var(--muted); cursor: pointer; white-space: nowrap; }
.tbtn:hover { background: var(--press); color: var(--ink); }
.tbtn:active { opacity: .7; }
.tbtn.link { color: var(--link); }
.tbtn.danger { color: var(--danger); }
.tbtn.danger.armed { background: var(--danger); color: var(--field); }
.empty { padding: 20px 8px; color: var(--muted); }
.note { margin-top: 14px; font-size: 14px; color: var(--danger); }

/* Inline editor */
.row.editing { display: block; padding: 14px 8px 12px; background: var(--hover); }
.editor { display: grid; grid-template-columns: 1fr 150px; gap: 12px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field > span { font-size: 13px; color: var(--muted); }
.field input, .field select { width: 100%; min-width: 0; padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--field); }
.field input:hover, .field select:hover { border-color: var(--muted); }
.editor-actions { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.solid { border: 0; background: var(--link); color: var(--link-ink); padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; }
.solid:hover { filter: brightness(1.08); }
.solid:active { opacity: .8; }
.solid:disabled { opacity: .5; cursor: default; }
.spacer { flex: 1; }
@media (max-width: 480px) { .editor { grid-template-columns: 1fr; } h1 { font-size: 26px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<style>
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
.signin { padding-top: 12vh; display: grid; gap: 14px; justify-items: start; }
.signin p { margin: 0; color: var(--muted); max-width: 40ch; }
.google { display: inline-flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--field); padding: 10px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; }
.google:hover { border-color: var(--muted); }
.google:active { opacity: .8; }
.foot { margin-top: 36px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; color: var(--muted); font-size: 14px; }
.foot .tbtn { font-size: 14px; padding: 4px 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>College Portal Tracker</h1>
    <div class="progress" id="progress" hidden>
      <div class="progress-label"><span id="progress-text">Loading your colleges…</span><span id="progress-sub"></span></div>
      <div class="bar"><i id="bar"></i></div>
    </div>
  </header>

  <section class="signin" id="signin" hidden>
    <p id="signin-text">Sign in with the same Google account on your phone and PC, and your checkmarks stay in sync.</p>
    <button class="google" id="google-btn" type="button">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      Sign in with Google
    </button>
  </section>

  <div id="app" hidden>
    <div class="toolbar">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Add a college" autocomplete="off" aria-label="Search for a college to add">
        <div class="results" id="results" role="listbox" hidden></div>
      </div>
      <div class="segmented" role="group" aria-label="Show">
        <button data-filter="all" aria-pressed="true">All</button>
        <button data-filter="todo" aria-pressed="false">Not logged in</button>
        <button data-filter="done" aria-pressed="false">Logged in</button>
      </div>
    </div>

    <main id="list">
      <p class="empty">Loading your colleges…</p>
    </main>
    <div class="foot"><span id="who"></span><button class="tbtn" id="signout" type="button">Sign out</button></div>
  </div>
  <div class="note" id="note" hidden></div>
</div>

<script type="module">
import { firebaseConfig } from "./firebase-config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signInWithRedirect, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, collection, doc, onSnapshot, setDoc, updateDoc, deleteDoc, getDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const COLLEGE_NAMES = ["Arizona State University","Auburn University","Babson College","Barnard College","Baylor University","Boston College","Boston University","Bowdoin College","Brandeis University","Brown University","Bucknell University","California Institute of Technology","Carleton College","Carnegie Mellon University","Case Western Reserve University","Clemson University","Colby College","Colgate University","College of Charleston","College of William & Mary","Colorado School of Mines","Colorado State University","Columbia University","Cornell University","Dartmouth College","Davidson College","Drexel University","Duke University","Elon University","Emory University","Florida A&M University","Florida International University","Florida State University","Fordham University","George Mason University","George Washington University","Georgetown University","Georgia State University","Georgia Tech","Gonzaga University","Hamilton College","Harvard University","Harvey Mudd College","Howard University","Indiana University Bloomington","Iowa State University","James Madison University","Johns Hopkins University","Kansas State University","Lehigh University","Louisiana State University","Loyola Marymount University","Loyola University Chicago","Marquette University","Massachusetts Institute of Technology","Miami University (Ohio)","Michigan State University","Middlebury College","Mississippi State University","New York University","North Carolina State University","Northeastern University","Northwestern University","Ohio State University","Oklahoma State University","Oregon State University","Penn State University","Pepperdine University","Pomona College","Princeton University","Purdue University","Rensselaer Polytechnic Institute","Rice University","Rochester Institute of Technology","Rutgers University","San Diego State University","Santa Clara University","Southern Methodist University (SMU)","Spelman College","Stanford University","Stevens Institute of Technology","Swarthmore College","Syracuse University","Temple University","Texas A&M University","Texas Christian University (TCU)","Texas State University","Texas Tech University","The University of Alabama","Tufts University","Tulane University","UC Berkeley","UC Davis","UC Irvine","UC San Diego","UC Santa Barbara","UCLA","University of Arizona","University of Arkansas","University of Central Florida","University of Chicago","University of Cincinnati","University of Colorado Boulder","University of Connecticut","University of Delaware","University of Denver","University of Florida","University of Georgia","University of Houston","University of Illinois Urbana-Champaign","University of Iowa","University of Kansas","University of Kentucky","University of Maryland","University of Massachusetts Amherst","University of Miami","University of Michigan","University of Minnesota","University of Mississippi","University of Missouri","University of Nebraska-Lincoln","University of North Carolina at Chapel Hill","University of North Florida","University of North Texas","University of Notre Dame","University of Oklahoma","University of Oregon","University of Pennsylvania","University of Pittsburgh","University of Rochester","University of San Diego","University of South Carolina","University of South Florida","University of Southern California","University of Tennessee","University of Texas at Austin","University of Texas at Dallas","University of Texas at San Antonio","University of Utah","University of Vermont","University of Virginia","University of Washington","University of Wisconsin-Madison","Vanderbilt University","Villanova University","Virginia Tech","Wake Forest University","Washington University in St. Louis","Wellesley College","Wesleyan University","West Virginia University","Williams College","Yale University"];

// Your starting list, added the first time you sign in.
const SEED = [
  ["ut-austin", "UT Austin", "reach", "https://utdirect.utexas.edu/apps/adm/mystatus/"],
  ["umich", "University of Michigan", "reach", "https://enrollmentconnect.umich.edu/apply/status"],
  ["unc", "UNC Chapel Hill", "reach", "https://applynow.unc.edu/apply/status"],
  ["georgia-tech", "Georgia Tech", "reach", "https://application.gatech.edu/apply/status"],
  ["miami", "University of Miami", "reach", "https://apply.miami.edu/apply/status"],
  ["uf", "University of Florida", "reach", "https://one.uf.edu/"],
  ["fsu", "Florida State University", "reach", "https://apply.fsu.edu/apply/status"],
  ["georgia-state", "Georgia State University", "reach", "https://undergradapply.gsu.edu/apply/status"],
  ["vanderbilt", "Vanderbilt University", "reach", "https://myappvu.vanderbilt.edu/portal/status"],
  ["smu", "SMU", "target", "https://admission.smu.edu/apply/status"],
  ["ohio-state", "Ohio State University", "target", "https://appstatus.osu.edu/"],
  ["texas-tech", "Texas Tech", "target", "https://texastech.my.site.com/portal/TX_SiteLogin?startURL=%2Fportal%2FTargetX_Base__Portal"],
  ["tcu", "TCU", "target", "https://my.tcu.edu/"],
  ["usf", "University of South Florida", "target", "https://discover.usf.edu/apply/status"],
  ["texas-am", "Texas A&M", "target", "https://applicant.tamu.edu/"],
  ["nc-state", "NC State", "target", "https://apply.ncsu.edu/portal/wolfpaw"],
  ["oklahoma", "University of Oklahoma", "safety", "https://hello.ou.edu/apply/status"],
  ["asu", "Arizona State University", "safety", "https://my.asu.edu/"],
  ["oklahoma-state", "Oklahoma State University", "safety", "https://orange.okstate.edu/account/"],
];

const TIERS = [["reach","Reach"],["target","Target"],["safety","Safety"],["other","Other"]];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = (u) => /^https?:\/\//i.test(u || "") ? u : "";
const slug = (s) => s.toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60) || "college";

let colRef = null, unsub = null, colleges = [], filter = "all", loaded = false;
let editingId = null, draft = null, removeArmed = false, focusEditor = false;

const CHECK_SVG = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';

function rowHtml(c) {
  if (c.id === editingId) return editorHtml(c);
  const url = safeUrl(c.portalUrl);
  const name = url
    ? `<a class="name" href="${esc(url)}" target="_blank" rel="noopener">${esc(c.name)}<span class="arrow" aria-hidden="true">↗</span></a>`
    : `<span class="name">${esc(c.name)}</span>`;
  const action = url ? `<button class="tbtn" data-act="edit">Edit</button>` : `<button class="tbtn link" data-act="edit">Add portal link</button>`;
  return `<li class="row${c.loggedIn ? " done" : ""}" data-id="${esc(c.id)}">
    <label class="check" title="Logged into portal"><input type="checkbox" id="chk-${esc(c.id)}" data-act="toggle" ${c.loggedIn ? "checked" : ""} aria-label="Logged into ${esc(c.name)} portal"><span class="box">${CHECK_SVG}</span></label>
    ${name}${action}
  </li>`;
}

function editorHtml(c) {
  const d = draft || { name: c.name, tier: c.tier || "other", portalUrl: c.portalUrl || "" };
  return `<li class="row editing" data-id="${esc(c.id)}">
    <form class="editor" data-act="save">
      <label class="field"><span>College name</span><input id="e-name" name="name" required value="${esc(d.name)}"></label>
      <label class="field"><span>Category</span><select id="e-tier" name="tier">${TIERS.map(([t, l]) => `<option value="${t}"${d.tier === t ? " selected" : ""}>${l}</option>`).join("")}</select></label>
      <label class="field wide"><span>Portal link</span><input id="e-portal" name="portalUrl" type="url" inputmode="url" placeholder="Paste the link from the school's email" value="${esc(d.portalUrl)}"></label>
      <div class="editor-actions">
        <button type="submit" class="solid">Save</button>
        <button type="button" class="tbtn" data-act="cancel">Cancel</button>
        <span class="spacer"></span>
        <button type="button" class="tbtn danger${removeArmed ? " armed" : ""}" data-act="remove">${removeArmed ? "Tap again to remove" : "Remove"}</button>
      </div>
    </form>
  </li>`;
}

function render() {
  const total = colleges.length, done = colleges.filter((c) => c.loggedIn).length;
  $("progress-text").textContent = !loaded ? "Loading your colleges…" : total ? `${done} of ${total} portals logged into` : "No colleges yet";
  $("progress-sub").textContent = loaded && total ? (done === total ? "All done" : `${total - done} to go`) : "";
  $("bar").style.width = total ? (done / total * 100) + "%" : "0";

  const shown = colleges.filter((c) => c.id === editingId || filter === "all" || (filter === "done" ? c.loggedIn : !c.loggedIn));
  let html = "";
  for (const [tier, label] of TIERS) {
    const list = shown.filter((c) => (c.tier || "other") === tier);
    if (list.length) html += `<section class="group"><h2>${label}</h2><ul class="rows">${list.map(rowHtml).join("")}</ul></section>`;
  }
  const emptyMsg = !loaded ? "Loading your colleges…" : !total ? "No colleges yet. Search above to add your first one." : filter === "todo" ? "You've logged into every portal." : "None yet.";
  $("list").innerHTML = html || `<p class="empty">${esc(emptyMsg)}</p>`;

  if (focusEditor && editingId) {
    const input = $("e-portal");
    if (input) { focusEditor = false; input.closest(".row").scrollIntoView({ block: "center" }); input.focus(); }
  }
}

function sortColleges(list) {
  const order = Object.fromEntries(TIERS.map(([t], i) => [t, i]));
  return list.sort((a, b) => (order[a.tier] ?? 9) - (order[b.tier] ?? 9) || (a.order ?? 0) - (b.order ?? 0) || a.name.localeCompare(b.name));
}

function showNote(msg) { $("note").textContent = msg; $("note").hidden = !msg; }
function startEdit(c, focus) { editingId = c.id; draft = null; removeArmed = false; focusEditor = !!focus; render(); }
function stopEdit() { editingId = null; draft = null; removeArmed = false; render(); }

/* ---------- Search ---------- */
let resultItems = [], sel = 0;
function renderResults() {
  const q = $("search").value.trim().toLowerCase();
  if (!q) { $("results").hidden = true; return; }
  const have = new Set(colleges.map((c) => c.name.toLowerCase()));
  const words = q.split(/\s+/);
  const matches = COLLEGE_NAMES.filter((n) => !have.has(n.toLowerCase()) && words.every((w) => n.toLowerCase().includes(w))).slice(0, 7);
  resultItems = matches.map((n) => ({ name: n, label: n, tag: "Add" }));
  if (!matches.some((n) => n.toLowerCase() === q)) resultItems.push({ name: $("search").value.trim(), label: `“${$("search").value.trim()}”`, tag: "Add as typed" });
  sel = Math.min(sel, resultItems.length - 1);
  $("results").innerHTML = resultItems.map((r, i) => `<button type="button" role="option" data-i="${i}" aria-selected="${i === sel}">${esc(r.label)}<small>${r.tag}</small></button>`).join("");
  $("results").hidden = false;
}
$("search").addEventListener("input", () => { sel = 0; renderResults(); });
$("search").addEventListener("keydown", (e) => {
  if ($("results").hidden) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + resultItems.length) % resultItems.length; renderResults(); }
  else if (e.key === "Enter") { e.preventDefault(); pick(sel); }
  else if (e.key === "Escape") { $("results").hidden = true; }
});
$("results").addEventListener("mousedown", (e) => { const b = e.target.closest("button[data-i]"); if (b) { e.preventDefault(); pick(+b.dataset.i); } });
$("search").addEventListener("blur", () => setTimeout(() => { $("results").hidden = true; }, 120));

async function pick(i) {
  const r = resultItems[i]; if (!r) return;
  $("search").value = ""; $("results").hidden = true; $("search").blur();
  const existing = colleges.find((c) => c.name.toLowerCase() === r.name.toLowerCase());
  if (existing) { startEdit(existing, true); return; }
  let id = slug(r.name);
  if (colleges.some((c) => c.id === id)) id += "-" + Date.now().toString(36);
  if (filter !== "all") { filter = "all"; syncFilter(); }
  editingId = id; draft = null; removeArmed = false; focusEditor = true;
  try { await setDoc(doc(colRef, id), { name: r.name, tier: "target", portalUrl: "", loggedIn: false, order: Date.now() }); showNote(""); }
  catch { editingId = null; render(); showNote("Couldn't add that college. Check your connection and try again."); }
}

/* ---------- List actions ---------- */
$("list").addEventListener("click", async (e) => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const id = el.closest(".row")?.dataset.id;
  const c = colleges.find((x) => x.id === id);
  if (el.dataset.act === "edit" && c) startEdit(c, true);
  else if (el.dataset.act === "cancel") stopEdit();
  else if (el.dataset.act === "remove" && c) {
    if (!removeArmed) { removeArmed = true; render(); return; }
    try { await deleteDoc(doc(colRef, id)); stopEdit(); }
    catch { showNote("Couldn't remove that college. Try again."); }
  }
});
$("list").addEventListener("input", (e) => {
  const form = e.target.closest(".editor"); if (!form) return;
  draft = { name: form.elements.name.value, tier: form.elements.tier.value, portalUrl: form.elements.portalUrl.value };
});
$("list").addEventListener("keydown", (e) => { if (e.key === "Escape" && e.target.closest(".editor")) stopEdit(); });
$("list").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = e.target, id = form.closest(".row").dataset.id;
  const name = form.elements.name.value.trim(); if (!name) return;
  let portal = form.elements.portalUrl.value.trim();
  if (portal && !/^https?:\/\//i.test(portal)) portal = "https://" + portal;
  form.querySelector(".solid").disabled = true;
  try { await updateDoc(doc(colRef, id), { name, tier: form.elements.tier.value, portalUrl: portal }); showNote(""); stopEdit(); }
  catch { form.querySelector(".solid").disabled = false; showNote("Couldn't save that change. Check your connection and try again."); }
});
$("list").addEventListener("change", async (e) => {
  if (e.target.dataset.act !== "toggle") return;
  const id = e.target.closest(".row").dataset.id, val = e.target.checked;
  const c = colleges.find((x) => x.id === id); if (c) { c.loggedIn = val; render(); }
  try { await updateDoc(doc(colRef, id), { loggedIn: val }); }
  catch { showNote("Couldn't save that checkmark. Check your connection and try again."); }
});

function syncFilter() { document.querySelectorAll(".segmented button").forEach((x) => x.setAttribute("aria-pressed", x.dataset.filter === filter)); }
document.querySelectorAll(".segmented button").forEach((b) => b.onclick = () => { filter = b.dataset.filter; syncFilter(); render(); });

/* ---------- Sign-in and sync ---------- */
function showSignedOut(text) {
  $("signin").hidden = false; $("app").hidden = true; $("progress").hidden = true;
  if (text) $("signin-text").textContent = text;
}

if (!firebaseConfig.apiKey || firebaseConfig.apiKey.startsWith("PASTE")) {
  showSignedOut("Setup isn't finished yet: the Firebase settings still need to be pasted into firebase-config.js.");
  $("google-btn").hidden = true;
} else {
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const fs = initializeFirestore(app, { localCache: persistentLocalCache() });
  const provider = new GoogleAuthProvider();

  $("google-btn").onclick = async () => {
    showNote("");
    try { await signInWithPopup(auth, provider); }
    catch (err) {
      if (["auth/popup-blocked", "auth/operation-not-supported-in-this-environment", "auth/cancelled-popup-request"].includes(err?.code)) {
        try { await signInWithRedirect(auth, provider); } catch { showNote("Couldn't open Google sign-in. Try again."); }
      } else if (err?.code !== "auth/popup-closed-by-user") showNote("Couldn't sign in. Try again.");
    }
  };
  $("signout").onclick = () => signOut(auth);

  onAuthStateChanged(auth, async (user) => {
    if (unsub) { unsub(); unsub = null; }
    colleges = []; loaded = false; editingId = null;
    if (!user) { showSignedOut(); return; }
    $("signin").hidden = true; $("app").hidden = false; $("progress").hidden = false;
    $("who").textContent = user.email ? `Signed in as ${user.email}` : "Signed in";
    render();

    colRef = collection(fs, "users", user.uid, "colleges");
    const metaRef = doc(fs, "users", user.uid);
    try {
      const meta = await getDoc(metaRef);
      if (!meta.exists() || !meta.data().seeded) {
        const batch = writeBatch(fs);
        SEED.forEach(([id, name, tier, portalUrl], i) => batch.set(doc(colRef, id), { name, tier, portalUrl, loggedIn: false, order: i + 1 }));
        batch.set(metaRef, { seeded: true }, { merge: true });
        await batch.commit();
      }
    } catch { showNote("Couldn't reach your saved list. Check your connection."); }

    unsub = onSnapshot(colRef, (snap) => {
      colleges = sortColleges(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
      loaded = true;
      if (editingId && !colleges.some((c) => c.id === editingId)) { editingId = null; draft = null; }
      render();
    }, () => { loaded = true; render(); showNote("Lost connection to your saved list. Reload the page to reconnect."); });
  });
}
</script>
